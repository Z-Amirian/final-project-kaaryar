<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازارینو-فروشگاه</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Vazirmatn-font-face.css">
</head>

<body>
    <header class="header">
        <nav class="navbar">
            <a href="#" class="link navbar__logo">
                بازارینو
            </a>
            <div class="navbar__items">
                <div class="navbar__right">
                    <a href="#" class="link navbar__item">خانه</a>
                    <a href="#" class="link navbar__item">فروشگاه</a>
                    <button class="button navbar__item">دسته‌بندی‌ها</button>
                    <a href="#" class="link navbar__item">درباره ما</a>
                </div>
                <div class="navbar__left">
                    <button class="button navbar__item navbar__cart">سبد خرید.2</button>
                    <a href="#" class="navbar__item">ورود</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="store">
        <div class="store__header">
            <div class="store__breadcrumb body-text">
                خانه / فروشگاه
            </div>
            <h1 class="title store__title">
                فروشگاه
            </h1>
            <p class="store__description body-text">
                محصولات منتخب را با خیال راحت مقایسه و انتخاب کنید.
            </p>
        </div>

        <div class="store__content">
            <section class="products">

                <input class="products__search" type="search" placeholder="جستجو در محصولات...">
                <div class="products__toolbar">
                    <span class="products__sort body-text">
                        مرتب‌سازی: پرفروش‌ترین
                    </span>
                    <span class="products__count body-text">
                        نمایش ۶ محصول
                    </span>
                </div>

                <div class="products__list">



                </div>

            </section>
            <aside class="filter">

                <h2 class="filter__title">فیلتر محصولات</h2>

                <hr>

                <div class="category">
                    <h3 class="category__title subtitle">دسته‌بندی</h3>

                    <label class="category__option body-text">
                        <input type="checkbox" class="checkbox" name="category">
                        دیجیتال و گجت
                    </label>

                    <label class="category__option body-text">
                        <input type="checkbox" class="checkbox" name="category">
                        خانه و سبک زندگی
                    </label>

                    <label class="category__option body-text">
                        <input type="checkbox" class="checkbox" name="category">
                        لوازم شخصی
                    </label>
                </div>

                <hr>

                <div class="price">
                    <h3 class="price__title subtitle">محدوده قیمت</h3>

                    <label class="price__option body-text">
                        <input type="radio" class="radio" name="price">
                        کمتر از ۲ میلیون
                    </label>

                    <label class="price__option body-text">
                        <input type="radio" class="radio" name="price">
                        ۲ تا ۵ میلیون
                    </label>

                    <label class="price__option body-text">
                        <input type="radio" class="radio" name="price">
                        بیشتر از ۵ میلیون
                    </label>
                </div>

                <hr>

                <div class="score">
                    <h3 class="score__title subtitle">امتیاز کاربران</h3>

                    <label class="score__option">
                        <input type="checkbox" class="checkbox" name="score">
                        ۴ ستاره به بالا
                    </label>
                </div>

            </aside>

        </div>

    </main>

    <footer class="footer">

    </footer>
</body>

</html>
